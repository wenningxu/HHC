name: New_MMM
channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults
dependencies:
  - python=3.12
  # === 核心修复 ===
  # 强制指定 CUDA 12.1，避开系统底层的 CUDA 11 冲突
  - pytorch-cuda=12.8
  - pytorch
  - torchvision
  - torchaudio
  # 必须安装 toolkit，否则没有 nvcc，PyTorch3D 无法编译
  - cuda-toolkit=12.8

  # === 常用科学计算库 ===
  - lightning
  - matplotlib
  - numpy
  - scipy
  - tensorboard
  - jupyter
  - ipykernel
  - scikit-image
  - pyyaml
  - pip

  # === 编译工具 (防止 g++ 版本冲突) ===
  - gxx_linux-64
  - sysroot_linux-64

  # === Pip 包 ===
  - pip:
      - beautifulsoup4
      - einops
      - fastjsonschema
      - fsspec
      - ftfy
      - gdown
      - jsonschema
      - jsonschema-specifications
      - nbformat
      - referencing
      - regex
      - rpds-py
      - soupsieve
      - tqdm
